version: 2

sources:
  - name: jaffle_shop
    database: RAW
    schema: jaffle_shop
    config:
      freshness:
        warn_after:
          count: 12
          period: hour
        error_after:
          count: 1
          period: day
      loaded_at_field: _etl_loaded_at
    tables:
      - name: customers
        config: 
          freshness: null
      - name: orders
  - name: strip
    database: RAW
    schema: stripe

    tables:
      - name: payment